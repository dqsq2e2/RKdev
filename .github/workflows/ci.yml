name: RKdev checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: recovery/app/go.mod
          cache-dependency-path: recovery/app/go.sum
      - run: sudo apt-get update && sudo apt-get install -y gdisk e2fsprogs u-boot-tools
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: go test ./...
        working-directory: recovery/app
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/rkdev-arm64 .
        working-directory: recovery/app
